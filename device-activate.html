<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate JMX Digital Card</title><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><main class="portal-shell"><section class="portal-card"><div class="brand-mark"><i class="fa-solid fa-wifi"></i></div><p class="eyebrow">JMX DIGITAL CARD</p><h1>Activate Your Card</h1><p class="muted">Enter the activation code supplied with your JMX NFC product. After the code is verified, continue with Google to claim the card and open your private editor.</p><div id="deviceIdentity" class="status"></div><label>Activation Code<input id="activationCode" autocomplete="one-time-code" autocapitalize="characters" placeholder="ACT-XXXXXXXX"></label><button id="verifyCodeButton" class="primary" type="button">Verify Activation Code</button><div id="ownerStep" hidden><div class="auth-divider"><span>code verified</span></div><button id="googleButton" class="google-button" type="button"><span class="google-g" aria-hidden="true">G</span><span>Continue with Google</span></button><p class="muted">The Google account you choose becomes the owner account for this card.</p></div><p id="status" class="status"></p></section></main><script type="module" src="device-activate.js"></script></body></html>
