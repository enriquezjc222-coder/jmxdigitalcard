<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activate JMX NFC Batch</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;background:#090909;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center}.box{width:min(540px,calc(100% - 30px));background:#151515;border:1px solid #333;border-radius:20px;padding:24px}.box input{width:100%;box-sizing:border-box;padding:13px;margin:7px 0 12px;border-radius:10px;border:1px solid #444}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{padding:12px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer}.status{min-height:24px;color:#bbb}</style></head><body><main class="box"><h1>Activate NFC Device Batch</h1><p>Use the single batch activation code supplied by JMX. All devices in that batch will be activated together while keeping separate Device IDs.</p><label>Batch Activation Code<input id="batchCode" autocomplete="one-time-code"></label><label>Email<input id="email" type="email"></label><label>Password<input id="password" type="password"></label><div class="actions"><button id="emailButton">Sign In & Activate</button><button id="googleButton">Continue with Google</button></div><p id="status" class="status"></p></main><script type="module" src="device-activate.js"></script></body></html>
