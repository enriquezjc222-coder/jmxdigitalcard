<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JMX Digital Card Owner Login</title><link rel="stylesheet" href="portal.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><main class="portal-shell"><section class="portal-card"><div class="brand-mark"><i class="fa-solid fa-user-lock"></i></div><p class="eyebrow">JMX DIGITAL CARD</p><h1>Owner Login</h1><p class="muted">Sign in to edit only the NFC card linked to your account.</p><div id="loginForm"><button id="googleLoginButton" class="google-button" type="button"><span class="google-g" aria-hidden="true">G</span><span>Continue with Google</span></button><div class="auth-divider"><span>or use email and password</span></div><label>Email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="loginButton" class="primary" type="button">Sign In</button><p id="status" class="status"></p></div><div id="cards" hidden><h2>Your Cards</h2><div id="cardList" class="owner-list"></div><button id="logout" class="secondary" type="button">Sign Out</button></div></section></main><script type="module" src="login.js"></script></body></html>
